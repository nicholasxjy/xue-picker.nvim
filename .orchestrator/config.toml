# Review every agent's model, mode, and thinking setting before the first plan.
# The model values below are examples, not a promise of account availability.
max_workers = 1
max_review_attempts = 3
agent_timeout_seconds = 3600
validation_timeout_seconds = 3600

# Agent types: codex, opencode, pi, gemini, claude (independently per identity).
# Set a model supported by that CLI. See examples/mixed-agents.toml.

# Replace these with the repository's real final validation commands.
validation_commands = [["git", "diff", "--check"]]

[herdr]
command = "herdr"

[agents.lebang]
role = "planner"
agent = "codex"
model = "gpt-6-astra"
mode = "plan"
thinking = "xhigh"
skill = "planner"

[agents.kd]
role = "coder"
agent = "codex"
model = "gpt-6-astra"
mode = "build"
thinking = "xhigh"
skill = "coder"

[agents.westbrook]
role = "tester"
agent = "pi"
model = "google-antigravity/gemini-3.8-flash"
mode = "build"
thinking = "high"
skill = "tester"

[agents.curry]
role = "reviewer"
agent = "codex"
model = "gpt-5.6-astra"
mode = "build"
thinking = "xhigh"
skill = "reviewer"

[agents.duncan]
role = "integrator"
agent = "pi"
model = "google-antigravity/gemini-3.8-flash"
mode = "build"
thinking = "high"
skill = "integrator"
